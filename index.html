<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gamer Profile Bento Grid</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bento-container">
        <div class="bento-item profile">
            <div class="avatar"></div>
            <h1>PlayerOne</h1>
            <p>Pro Gamer & Streamer</p>
            <div class="status">Online</div>
        </div>
        <div class="bento-item rank">
            <h3>Current Rank</h3>
            <div class="rank-icon">Diamond I</div>
        </div>
        <div class="bento-item hours">
            <h3>Play Time</h3>
            <p class="big-text">1,420 hrs</p>
        </div>
        <div class="bento-item recent-games">
            <h3>Recent Games</h3>
            <div class="games-list">
                <div class="game">Cyberpunk 2077</div>
                <div class="game">Valorant</div>
                <div class="game">Apex Legends</div>
            </div>
        </div>
        <div class="bento-item trophies">
            <h3>Trophies</h3>
            <ul>
                <li>🏆 First Blood</li>
                <li>🏆 Sharpshooter</li>
                <li>🏆 Survivor</li>
                <li>🏆 Untouchable</li>
            </ul>
        </div>
        <div class="bento-item friends">
            <h3>Friends Online (12)</h3>
            <div class="friends-avatars">
                <div class="f-avatar" style="background-color: #ff7b72;"></div>
                <div class="f-avatar" style="background-color: #79c0ff;"></div>
                <div class="f-avatar" style="background-color: #d2a8ff;"></div>
                <div class="f-avatar" style="background-color: #a5d6ff;"></div>
            </div>
        </div>
    </div>
</body>
</html>
